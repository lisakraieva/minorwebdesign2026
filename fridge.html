<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Холодильник</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .container {
      text-align: center;
    }

    h1 {
      color: white;
      margin-bottom: 20px;
      font-size: 28px;
    }

    .instructions {
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 20px;
      font-size: 14px;
    }

    #canvas {
      display: block;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      background: #f0f0f0;
    }

    .controls {
      color: white;
      margin-top: 20px;
      font-size: 14px;
    }

    .button {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid white;
      padding: 10px 20px;
      margin-top: 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .button:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧊 3D Холодильник</h1>
    <div class="instructions">
      <p>🖱️ Вращайте мышкой чтобы повернуть холодильник</p>
      <p>⬅️ Нажмите на дверцу чтобы её открыть</p>
    </div>
    <canvas id="canvas" width="600" height="700"></canvas>
    <div class="controls">
      <button class="button" onclick="resetFridge()">🔄 Сброс позиции</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Сцена, камера, рендерер
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);
    
    const camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    camera.position.z = 3;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.shadowMap.enabled = true;

    // Освещение
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(5, 5, 5);
    directionalLight.castShadow = true;
    scene.add(directionalLight);

    // Группа холодильника
    const fridgeGroup = new THREE.Group();
    scene.add(fridgeGroup);

    // Основной корпус холодильника
    const bodyGeometry = new THREE.BoxGeometry(1, 2, 0.6);
    const bodyMaterial = new THREE.MeshStandardMaterial({
      color: 0xcccccc,
      metalness: 0.3,
      roughness: 0.5
    });
    const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
    body.castShadow = true;
    body.receiveShadow = true;
    fridgeGroup.add(body);

    // Дверца холодильника
    const doorGeometry = new THREE.BoxGeometry(0.95, 1.95, 0.1);
    const doorMaterial = new THREE.MeshStandardMaterial({
      color: 0xdddddd,
      metalness: 0.4,
      roughness: 0.4
    });
    const door = new THREE.Mesh(doorGeometry, doorMaterial);
    door.position.set(0, 0, 0.35);
    door.castShadow = true;
    door.receiveShadow = true;
    fridgeGroup.add(door);

    // Ручка дверцы
    const handleGeometry = new THREE.BoxGeometry(0.05, 0.3, 0.05);
    const handleMaterial = new THREE.MeshStandardMaterial({
      color: 0x333333,
      metalness: 0.8,
      roughness: 0.2
    });
    const handle = new THREE.Mesh(handleGeometry, handleMaterial);
    handle.position.set(0.4, 0, 0.42);
    handle.castShadow = true;
    door.add(handle);

    // Холодильное отделение (видно при открытии)
    const innerGeometry = new THREE.BoxGeometry(0.9, 1.9, 0.5);
    const innerMaterial = new THREE.MeshStandardMaterial({
      color: 0xeeeeee,
      metalness: 0.1,
      roughness: 0.8
    });
    const inner = new THREE.Mesh(innerGeometry, innerMaterial);
    inner.position.set(0, 0, -0.05);
    inner.castShadow = true;
    inner.receiveShadow = true;
    fridgeGroup.add(inner);

    // Переменные для управления
    let mouse = { x: 0, y: 0 };
    let targetRotation = { x: 0, y: 0 };
    let doorOpen = false;
    let doorRotation = 0;
    const doorSpeed = 0.08;
    const rotationSpeed = 0.05;

    // Обработчик движения мыши
    document.addEventListener('mousemove', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      
      targetRotation.y = mouse.x * 0.5;
      targetRotation.x = mouse.y * 0.3;
    });

    // Обработчик клика на холодильник
    canvas.addEventListener('click', (event) => {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      
      // Простая проверка: если клик близко к дверце
      if (x > rect.width * 0.3 && x < rect.width * 0.7 && 
          y > rect.height * 0.2 && y < rect.height * 0.8) {
        doorOpen = !doorOpen;
      }
    });

    // Функция сброса позиции
    window.resetFridge = function() {
      doorOpen = false;
      targetRotation.x = 0;
      targetRotation.y = 0;
    };

    // Анимация
    function animate() {
      requestAnimationFrame(animate);

      // Плавная ротация холодильника
      fridgeGroup.rotation.x += (targetRotation.x - fridgeGroup.rotation.x) * rotationSpeed;
      fridgeGroup.rotation.y += (targetRotation.y - fridgeGroup.rotation.y) * rotationSpeed;

      // Анимация открытия/закрытия дверцы
      const targetDoorRotation = doorOpen ? Math.PI * 0.4 : 0;
      doorRotation += (targetDoorRotation - doorRotation) * doorSpeed;
      door.rotation.y = doorRotation;

      renderer.render(scene, camera);
    }

    // Обработка изменения размера окна
    window.addEventListener('resize', () => {
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    });

    animate();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's new in my fridge?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;width:100%}
    body{
      min-height:100vh;
      font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: #a7d8f7; /* light blue similar to screenshot */
      color:#000;
      overflow:hidden; /* ensure no scrollbars */
    }

    /* subtle paper/crumple texture using layered gradients */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background-image:
        radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(0deg, rgba(0,0,0,0.02) 0%, transparent 4%),
        repeating-linear-gradient(135deg, rgba(0,0,0,0.02) 0 1px, transparent 1px 8px);
      opacity:0.16;
      pointer-events:none;
      mix-blend-mode:multiply;
      z-index:0;
    }

    /* content wrapper which we'll scale so whole composition fits inside viewport */
    .stage{
      position:absolute;
      left:50%;
      top:50%;
      transform-origin: 0 0; /* we'll translate after scaling */
      will-change: transform;
      width:1200px; /* design reference width */
      height:720px; /* design reference height */
      margin:0;
    }

    .page{
      position:relative;
      width:1200px;
      height:720px;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      padding-left:72px; /* space on left like screenshot */
      padding-right:72px;
      z-index:1;
      background:transparent;
    }

    .left{
      width:56%;
      max-width:920px;
    }

    h1{
      font-weight:900;
      font-size:220px; /* fixed large size in design units */
      line-height:0.88;
      color:#000;
      letter-spacing:-0.02em;
      font-style:normal;
      display:inline-block;
      cursor:default;
      user-select:none;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      z-index:2;
    }

    .line{display:block}

    /* per-char */
    .char{display:inline-block;transition:transform 520ms cubic-bezier(.2,.8,.2,1),opacity 360ms;will-change:transform,opacity}
    .char.active{transform:translate(var(--tx,0),var(--ty,0)) rotate(var(--rot,0));opacity:var(--op,1)}

    /* right fridge */
    .fridge-wrap{
      position:absolute;
      right:72px;
      top:36px;
      width:480px;
      height:648px;
      display:block;
      z-index:1;
      pointer-events:auto;
    }

    /* if user provides an image at assets/fridge.png, it will be shown; otherwise this decorative fridge will remain */
    .fridge{
      position:relative;
      width:100%;
      height:100%;
      background:linear-gradient(180deg,#f4f4f4 0%,#e7e7e7 100%);
      border-left:6px solid rgba(0,0,0,0.08);
      border-top:6px solid rgba(0,0,0,0.06);
      box-shadow: -20px 10px 40px rgba(0,0,0,0.12);
      overflow:visible;
      border-radius:4px;
      transform-origin:center;
      transition:transform 420ms cubic-bezier(.2,.9,.2,1);
      background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0 1px, transparent 1px 14px), linear-gradient(0deg, rgba(0,0,0,0.02), transparent);
    }

    .fridge .logo{position:absolute;left:28px;top:26%;font-size:14px;color:rgba(0,0,0,0.45);letter-spacing:.12em}

    .fridge::after{
      content:"";
      position:absolute;
      right:-8px;
      top:0;
      width:14px;
      height:100%;
      border-right:6px solid rgba(0,0,0,0.06);
      background:linear-gradient(180deg, rgba(0,0,0,0.02), transparent 10%);
      border-top-right-radius:4px;
      border-bottom-right-radius:4px;
    }

    /* image style when user provides assets/fridge.png */
    .fridge-img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05);}

    /* particles from fridge */
    .frag{position:absolute;width:10px;height:10px;background:#000;border-radius:1px;pointer-events:none;animation:frag 900ms cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes frag{0%{transform:translate(0,0) scale(1);opacity:1}80%{transform:translate(var(--fx,80px),var(--fy,-20px)) rotate(var(--frot,90deg)) scale(.8);opacity:.9}100%{transform:translate(calc(var(--fx,120px)),calc(var(--fy,-40px))) scale(.3);opacity:0}}

    /* center the scaled stage */
    .stage-centered{transform-origin: 0 0;}

    /* responsive fallback */
    @media (max-width:900px){
      h1{font-size:120px}
      .fridge-wrap{display:none}
    }

  </style>
</head>
<body>
  <!-- stage is a fixed-size composition (1200x720 design units). JS will scale it to fit viewport so the entire image fits on screen. -->
  <div class="stage" id="stage">
    <div class="page" role="main" aria-label="hero">
      <div class="left">
        <h1 id="title" aria-label="What's new in my fridge?">
          <span class="line">What's</span>
          <span class="line">new</span>
          <span class="line">in my</span>
          <span class="line">fridge?</span>
        </h1>
      </div>

      <div class="fridge-wrap" aria-hidden="true">
        <div class="fridge" id="fridge">
          <!-- If you add an image to assets/fridge.png it will be used here automatically -->
          <img src="assets/fridge.png" alt="fridge" class="fridge-img" id="fridgeImg" onerror="this.style.display='none'">
          <div class="logo">BOSCH</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- make the fixed-size stage scale so whole composition fits into the viewport ---
    const stage = document.getElementById('stage');
    function fitStage(){
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const designW = 1200; // width used in CSS
      const designH = 720;  // height used in CSS
      const scale = Math.min(vw / designW, vh / designH);
      // center the stage in viewport
      const offsetX = (vw - designW * scale) / 2;
      const offsetY = (vh - designH * scale) / 2;
      stage.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    }
    window.addEventListener('resize', fitStage);
    window.addEventListener('orientationchange', fitStage);
    fitStage();

    // split title into characters for per-char effect
    const title = document.getElementById('title');
    const textLines = Array.from(title.querySelectorAll('.line'));
    const chars = [];
    textLines.forEach(line => {
      const str = line.textContent;
      line.textContent = '';
      for (let i=0;i<str.length;i++){
        const ch = str[i] === ' ' ? '\u00A0' : str[i];
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = ch;
        line.appendChild(span);
        chars.push(span);
      }
    });

    function createFragments(container,x,y,count=22,size=7){
      for(let i=0;i<count;i++){
        const f = document.createElement('div');
        f.className='frag';
        f.style.width = size+'px';
        f.style.height = size+'px';
        // position relative to viewport (container is body)
        f.style.left = (x - size/2) + 'px';
        f.style.top = (y - size/2) + 'px';
        const fx = 30 + Math.random()*160;
        const fy = -80 + Math.random()*120;
        const frot = (Math.random()*360)+'deg';
        f.style.setProperty('--fx',fx+'px');
        f.style.setProperty('--fy',fy+'px');
        f.style.setProperty('--frot',frot);
        container.appendChild(f);
        f.addEventListener('animationend', ()=>f.remove());
      }
    }

    // heading hover
    title.addEventListener('mouseenter', ()=>{
      chars.forEach((span,i)=>{
        const dir = (i%2? -1:1);
        const tx = (10 + Math.random()*38)*dir;
        const ty = -6 - Math.random()*26;
        const rot = (-8 + Math.random()*16)+'deg';
        const op = 0.9 - Math.random()*0.35;
        span.style.setProperty('--tx',tx+'px');
        span.style.setProperty('--ty',ty+'px');
        span.style.setProperty('--rot',rot);
        span.style.setProperty('--op',op);
        setTimeout(()=>span.classList.add('active'), i*20);
      });
      // fragments: compute position of right edge of title in viewport
      const r = title.getBoundingClientRect();
      createFragments(document.body, r.right - 28, r.top + r.height/2, 30, 8);
    });
    title.addEventListener('mouseleave', ()=>{
      for(let i=chars.length-1;i>=0;i--){
        const span = chars[i];
        setTimeout(()=>{
          span.style.setProperty('--tx','0px');
          span.style.setProperty('--ty','0px');
          span.style.setProperty('--rot','0deg');
          span.style.setProperty('--op','1');
          span.classList.remove('active');
        }, (chars.length-1 - i)*18);
      }
      const r = title.getBoundingClientRect();
      createFragments(document.body, r.right - 28, r.top + r.height/2, 12, 7);
    });

    // fridge hover
    const fridge = document.getElementById('fridge');
    let fridgeHover = false;
    fridge.addEventListener('mouseenter', ()=>{
      fridgeHover = true;
      fridge.style.transform = 'perspective(900px) rotateY(-8deg) skewX(-3deg) scale(1.015)';
      const r = fridge.getBoundingClientRect();
      createFragments(document.body, r.left + r.width*0.6, r.top + r.height*0.3, 34, 9);
      // micro pulse
      let t=0;
      function pulse(){
        if(!fridgeHover) return;
        fridge.style.transform = `perspective(900px) rotateY(${ -8 + Math.sin(t/4)*1.2 }deg) skewX(${ -3 + Math.cos(t/3)*0.6 }deg) scale(${1.015 + Math.sin(t/6)*0.004})`;
        t++;
        requestAnimationFrame(pulse);
      }
      requestAnimationFrame(pulse);
    });
    fridge.addEventListener('mouseleave', ()=>{
      fridgeHover = false;
      fridge.style.transform = '';
      const r = fridge.getBoundingClientRect();
      createFragments(document.body, r.left + r.width*0.7, r.top + r.height*0.4, 12, 8);
    });

    // keyboard access
    title.tabIndex = 0;
    fridge.tabIndex = 0;
    title.addEventListener('focus', ()=>title.dispatchEvent(new Event('mouseenter')));
    title.addEventListener('blur', ()=>title.dispatchEvent(new Event('mouseleave')));
    fridge.addEventListener('focus', ()=>fridge.dispatchEvent(new Event('mouseenter')));
    fridge.addEventListener('blur', ()=>fridge.dispatchEvent(new Event('mouseleave')));

    // initialize fit on DOMContentLoaded just in case fonts change size
    window.addEventListener('DOMContentLoaded', ()=>{
      fitStage();
      // small delay to ensure layout settled
      setTimeout(fitStage, 200);
    });
  </script>
</body>
</html>

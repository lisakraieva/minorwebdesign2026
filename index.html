<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Fridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;
      background: #e9cfd8;
      font-family: 'Cormorant Garamond', serif;
      color: #000;
      overflow: hidden;
    }

    .page {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0;
      background: #e9cfd8;
    }

    .center-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .eyes-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 56px;
      margin-bottom: 32px;
      height: 120px;
    }

    .eye {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #f3f0ef;
      border: 2px solid rgba(0, 0, 0, 0.10);
      box-shadow: inset 0 8px 8px rgba(255,255,255,0.7), inset 0 -8px 8px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .eye::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      clip-path: ellipse(38% 42% at 32% 28%);
    }

    .pupil {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #000;
      transform: translate(-50%, -50%);
      transition: transform 0.06s linear;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.04);
    }

    .pupil::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 10px;
      top: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.75);
    }

    h1 {
      position: relative;
      margin: 0;
      color: rgba(86, 73, 75, 0.9);
      font-size: clamp(3.5rem, 8vw, 8rem);
      line-height: 1;
      font-weight: 400;
      letter-spacing: -0.02em;
      font-style: italic;
      text-align: center;
      cursor: default;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    h1:hover {
      transform: scaleY(0.85);
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="center-wrap">
      <div class="eyes-container" aria-label="Eyes">
        <div class="eye">
          <div class="pupil" id="pupilLeft"></div>
        </div>
        <div class="eye">
          <div class="pupil" id="pupilRight"></div>
        </div>
      </div>

      <h1 id="title">My Fridge</h1>
    </div>
  </div>

  <script>
    const pupils = [
      document.getElementById('pupilLeft'),
      document.getElementById('pupilRight')
    ];

    const eyes = document.querySelectorAll('.eye');

    document.addEventListener('mousemove', (event) => {
      eyes.forEach((eye, index) => {
        const rect = eye.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = event.clientX - cx;
        const dy = event.clientY - cy;
        const angle = Math.atan2(dy, dx);
        const radius = 26;

        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        pupils[index].style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
      });
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Fridge</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      z-index: 10;
    }

    h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      margin-bottom: 10px;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.25);
    }

    .subtitle {
      opacity: 0.9;
      font-size: 1rem;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .fridge-box {
      width: min(76vw, 620px);
      height: min(78vw, 700px);
      max-width: 620px;
      max-height: 700px;
      background: rgba(255,255,255,0.12);
      border-radius: 18px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
    }

    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls {
      text-align: center;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    button {
      margin-top: 8px;
      border: 2px solid rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 1rem;
      padding: 10px 22px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: rgba(255,255,255,0.28);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <header>
    <h1>My Fridge</h1>
    <div class="subtitle">Interactive 3D fridge</div>
  </header>

  <main>
    <div class="fridge-box">
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
      <p>Move the mouse to rotate the fridge</p>
      <p>Click to open and close the door</p>
      <button onclick="resetFridge()">Reset position</button>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf1f1f1);

    const camera = new THREE.PerspectiveCamera(60, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    camera.position.z = 3.6;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;

    const ambient = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
    keyLight.position.set(4, 5, 4);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const fridgeGroup = new THREE.Group();
    scene.add(fridgeGroup);

    const bodyMaterial = new THREE.MeshStandardMaterial({
      color: 0xd9d9d9,
      metalness: 0.45,
      roughness: 0.4
    });

    const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 2.3, 0.75), bodyMaterial);
    body.position.y = 0.1;
    body.castShadow = true;
    body.receiveShadow = true;
    fridgeGroup.add(body);

    const innerMaterial = new THREE.MeshStandardMaterial({
      color: 0xeaeaea,
      metalness: 0.15,
      roughness: 0.9
    });

    const inner = new THREE.Mesh(new THREE.BoxGeometry(1.15, 2.05, 0.52), innerMaterial);
    inner.position.set(0, 0.1, -0.08);
    fridgeGroup.add(inner);

    const doorMaterial = new THREE.MeshStandardMaterial({
      color: 0xe5e5e5,
      metalness: 0.5,
      roughness: 0.35
    });

    const door = new THREE.Mesh(new THREE.BoxGeometry(1.3, 2.15, 0.1), doorMaterial);
    door.position.set(0, 0.1, 0.42);
    door.castShadow = true;
    fridgeGroup.add(door);

    const handle = new THREE.Mesh(
      new THREE.BoxGeometry(0.06, 0.38, 0.08),
      new THREE.MeshStandardMaterial({ color: 0x2a2a2a, metalness: 0.9, roughness: 0.25 })
    );
    handle.position.set(0.5, 0.1, 0.52);
    door.add(handle);

    const stripe = new THREE.Mesh(
      new THREE.BoxGeometry(0.9, 0.08, 0.04),
      new THREE.MeshStandardMaterial({ color: 0x59a7ff, metalness: 0.3, roughness: 0.5 })
    );
    stripe.position.set(0, 0.75, 0.53);
    door.add(stripe);

    let targetRotationX = 0;
    let targetRotationY = 0;
    let doorOpen = false;
    let currentDoorAngle = 0;

    document.addEventListener('mousemove', (event) => {
      const x = (event.clientX / window.innerWidth) * 2 - 1;
      const y = -(event.clientY / window.innerHeight) * 2 + 1;
      targetRotationY = x * 0.9;
      targetRotationX = y * 0.5;
    });

    canvas.addEventListener('click', () => {
      doorOpen = !doorOpen;
    });

    window.resetFridge = function () {
      doorOpen = false;
      targetRotationX = 0;
      targetRotationY = 0;
    };

    function resizeRenderer() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    function animate() {
      requestAnimationFrame(animate);

      fridgeGroup.rotation.x += (targetRotationX - fridgeGroup.rotation.x) * 0.08;
      fridgeGroup.rotation.y += (targetRotationY - fridgeGroup.rotation.y) * 0.08;

      const targetDoorAngle = doorOpen ? -1.15 : 0;
      currentDoorAngle += (targetDoorAngle - currentDoorAngle) * 0.08;
      door.rotation.y = currentDoorAngle;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', resizeRenderer);
    resizeRenderer();
    animate();
  </script>
</body>
</html>

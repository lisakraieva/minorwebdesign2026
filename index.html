<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Fridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quirks+Sans&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: 'Quirks Sans', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(180deg, #f4cedd 0%, #f0cddd 8%, #eae2eb 100%);
      color: #000;
      overflow-x: hidden;
    }

    .page {
      width: min(92vw, 1180px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 30px 0 50px;
    }

    .brand {
      width: min(92vw, 1180px);
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 18px;
      position: relative;
      z-index: 3;
    }

    .brand-mark {
      background: #e1c68e;
      border-radius: 18px 18px 18px 18px;
      padding: 12px 26px 10px 22px;
      font-family: 'Quirks Sans', sans-serif;
      font-weight: 900;
      font-size: clamp(2.1rem, 2.5vw, 2.9rem);
      color: #000;
      line-height: 1;
      display: inline-block;
      transform: rotate(-1.5deg);
      box-shadow: 0 4px 0 rgba(0,0,0,0.25);
      border: 2px solid rgba(0,0,0,0.2);
    }

    header {
      text-align: center;
      margin-bottom: 18px;
      z-index: 10;
    }

    h1 {
      font-size: clamp(3.4rem, 8vw, 7rem);
      line-height: 0.82;
      margin: 0;
      text-shadow: 4px 4px 0 rgba(0,0,0,0.88);
      font-weight: 900;
      letter-spacing: -0.07em;
      color: #000;
      transform: scaleY(0.95);
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      width: 100%;
    }

    .fridge-box {
      width: min(76vw, 820px);
      height: min(66vw, 630px);
      max-width: 820px;
      max-height: 630px;
      background: rgba(22, 22, 26, 0.82);
      border-radius: 16px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(0,0,0,0.15);
    }

    #canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: rgba(22, 22, 26, 0.82);
    }

    .controls {
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.95;
      color: #000;
      font-weight: 600;
      display: none;
    }

    button {
      margin-top: 15px;
      border: 3px solid #000000;
      background: #90EE90;
      color: #000000;
      font-size: 1.1rem;
      padding: 12px 30px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s ease;
      font-weight: 700;
      font-family: 'Quirks Sans', sans-serif;
      display: none;
    }

    button:hover {
      background: #7FD87F;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand">
      <div class="brand-mark">NESTA</div>
    </div>

    <header>
      <h1>My Fridge</h1>
    </header>

    <main>
      <div class="fridge-box">
        <canvas id="canvas"></canvas>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2b2b2d);

    const camera = new THREE.PerspectiveCamera(42, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    camera.position.set(0, 0.4, 6.2);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;

    const ambient = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
    keyLight.position.set(4, 5, 4);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const fridgeGroup = new THREE.Group();
    scene.add(fridgeGroup);

    const bodyMaterial = new THREE.MeshStandardMaterial({
      color: 0xF0E5BF,
      metalness: 0.18,
      roughness: 0.72
    });

    const outerBody = new THREE.Mesh(new THREE.BoxGeometry(2.2, 3.3, 1.2), bodyMaterial);
    outerBody.position.y = 0.1;
    outerBody.castShadow = true;
    outerBody.receiveShadow = true;
    fridgeGroup.add(outerBody);

    const innerMaterial = new THREE.MeshStandardMaterial({
      color: 0xEAE2C9,
      metalness: 0.08,
      roughness: 0.9
    });

    const inner = new THREE.Mesh(new THREE.BoxGeometry(1.82, 2.98, 0.85), innerMaterial);
    inner.position.set(0, 0.08, -0.12);
    fridgeGroup.add(inner);

    const doorMaterial = new THREE.MeshStandardMaterial({
      color: 0xF4EBC1,
      metalness: 0.25,
      roughness: 0.65
    });

    const door = new THREE.Mesh(new THREE.BoxGeometry(2.05, 3.08, 0.12), doorMaterial);
    door.position.set(0, 0.1, 0.63);
    door.castShadow = true;
    fridgeGroup.add(door);

    const handle = new THREE.Mesh(
      new THREE.BoxGeometry(0.08, 0.42, 0.08),
      new THREE.MeshStandardMaterial({ color: 0x2b2b2d, metalness: 0.8, roughness: 0.28 })
    );
    handle.position.set(0.65, 0.1, 0.74);
    door.add(handle);

    const edgeStrip = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 0.12, 0.04),
      new THREE.MeshStandardMaterial({ color: 0xe7d08a, metalness: 0.3, roughness: 0.45 })
    );
    edgeStrip.position.set(0, 0.9, 0.72);
    door.add(edgeStrip);

    const topTrim = new THREE.Mesh(
      new THREE.BoxGeometry(2.3, 0.12, 1.24),
      new THREE.MeshStandardMaterial({ color: 0xdcc98d, metalness: 0.2, roughness: 0.7 })
    );
    topTrim.position.set(0, 1.8, 0);
    fridgeGroup.add(topTrim);

    const bottomTrim = new THREE.Mesh(
      new THREE.BoxGeometry(2.3, 0.12, 1.24),
      new THREE.MeshStandardMaterial({ color: 0xdcc98d, metalness: 0.2, roughness: 0.7 })
    );
    bottomTrim.position.set(0, -1.8, 0);
    fridgeGroup.add(bottomTrim);

    let targetRotationX = -0.25;
    let targetRotationY = 0.35;
    let doorOpen = false;
    let currentDoorAngle = 0;

    document.addEventListener('mousemove', (event) => {
      const x = (event.clientX / window.innerWidth) * 2 - 1;
      const y = -(event.clientY / window.innerHeight) * 2 + 1;
      targetRotationY = x * 0.8;
      targetRotationX = y * 0.45 - 0.25;
    });

    canvas.addEventListener('click', () => {
      doorOpen = !doorOpen;
    });

    window.resetFridge = function () {
      doorOpen = false;
      targetRotationX = -0.25;
      targetRotationY = 0.35;
    };

    function resizeRenderer() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    function animate() {
      requestAnimationFrame(animate);

      fridgeGroup.rotation.x += (targetRotationX - fridgeGroup.rotation.x) * 0.08;
      fridgeGroup.rotation.y += (targetRotationY - fridgeGroup.rotation.y) * 0.08;

      const targetDoorAngle = doorOpen ? -1.2 : 0;
      currentDoorAngle += (targetDoorAngle - currentDoorAngle) * 0.08;
      door.rotation.y = currentDoorAngle;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', resizeRenderer);
    resizeRenderer();
    animate();
  </script>
</body>
</html>

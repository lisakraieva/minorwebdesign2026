<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Fridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;
      background: #e9cfd8;
      font-family: 'Cormorant Garamond', serif;
      color: #000;
      overflow: hidden;
    }

    .page {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0;
      background: #e9cfd8;
    }

    .center-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .eyes-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 56px;
      margin-bottom: 32px;
      height: 120px;
    }

    .eye {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #f3f0ef;
      border: 2px solid rgba(0, 0, 0, 0.10);
      box-shadow: inset 0 8px 8px rgba(255,255,255,0.7), inset 0 -8px 8px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .eye::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      clip-path: ellipse(38% 42% at 32% 28%);
    }

    .pupil {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #000;
      transform: translate(-50%, -50%);
      transition: transform 0.06s linear;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.04);
    }

    .pupil::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 10px;
      top: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.75);
    }

    h1 {
      position: relative;
      margin: 0;
      color: rgba(86, 73, 75, 0.9);
      font-size: clamp(3.5rem, 8vw, 8rem);
      line-height: 1;
      font-weight: 400;
      letter-spacing: -0.02em;
      font-style: italic;
      text-align: center;
      cursor: default;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      /* make room for per-character transforms */
      display: inline-block;
      white-space: pre-wrap;
    }

    h1:hover {
      transform: scaleY(0.85);
    }

    /* per-character */
    .char {
      display: inline-block;
      transition: transform 500ms cubic-bezier(0.2,0.8,0.2,1), opacity 350ms;
      will-change: transform, opacity;
    }

    /* when active, each char uses CSS variables set by JS */
    .char.active {
      transform: translate(var(--tx,0), var(--ty,0)) rotate(var(--rot,0));
      opacity: var(--op,1);
    }

    /* pixel fragments */
    .fragment {
      position: absolute;
      width: 8px;
      height: 8px;
      background: rgba(86,73,75,0.95);
      pointer-events: none;
      transform-origin: center;
      will-change: transform, opacity;
      border-radius: 1px;
      mix-blend-mode: multiply;
      animation: frag-fly 800ms cubic-bezier(0.2,0.8,0.2,1) forwards;
    }

    @keyframes frag-fly {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      80% { transform: translate(var(--fx,80px), var(--fy, -20px)) rotate(var(--frot, 90deg)) scale(0.8); opacity: 0.8; }
      100% { transform: translate(calc(var(--fx,120px)), calc(var(--fy, -40px))) scale(0.4); opacity: 0; }
    }

    /* fridge block - decorative, will not change the main visual composition */
    .fridge {
      position: absolute;
      right: 6vw;
      top: 8vh;
      width: min(36vw, 420px);
      height: min(70vh, 620px);
      background: linear-gradient(180deg, #f7f7f7 0%, #e9e9e9 100%);
      border: 3px solid rgba(0,0,0,0.06);
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      border-radius: 6px;
      overflow: visible;
      display: block;
      z-index: 2;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      transition: transform 420ms cubic-bezier(0.2,0.9,0.2,1);
      background-image: linear-gradient(0deg, rgba(0,0,0,0.02) 0%, transparent 2%),
                        repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0 1px, transparent 1px 6px);
      background-blend-mode: overlay;
    }

    .fridge::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 8px;
      width: 60%;
      height: 22px;
      background: rgba(0,0,0,0.06);
      border-radius: 2px;
    }

    .fridge-logo {
      position: absolute;
      left: 28px;
      top: 40%;
      font-size: 12px;
      color: rgba(0,0,0,0.45);
      letter-spacing: 0.08em;
    }

    /* fridge deformation */
    .fridge.deform {
      transform: perspective(800px) rotateY(-6deg) skewX(-2deg) scale(1.02);
    }

    .fridge .frag {
      position: absolute;
      width: 10px;
      height: 10px;
      background: rgba(86,73,75,0.95);
      pointer-events: none;
      animation: frag-fly 900ms cubic-bezier(0.2,0.8,0.2,1) forwards;
    }

    /* small responsive tweak so fridge doesn't cover the text on narrow screens */
    @media (max-width: 900px) {
      .fridge { right: 3vw; width: min(40vw, 300px); top: 6vh; height: min(48vh, 420px); opacity: 0.95; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="center-wrap">
      <div class="eyes-container" aria-label="Eyes">
        <div class="eye">
          <div class="pupil" id="pupilLeft"></div>
        </div>
        <div class="eye">
          <div class="pupil" id="pupilRight"></div>
        </div>
      </div>

      <h1 id="title" aria-label="My Fridge">My Fridge</h1>
    </div>

    <!-- decorative fridge element added (does not change overall design) -->
    <div class="fridge" id="fridge" aria-hidden="true">
      <div class="fridge-logo">BOSCH</div>
    </div>
  </div>

  <script>
    // pupils follow cursor (original behaviour)
    const pupils = [
      document.getElementById('pupilLeft'),
      document.getElementById('pupilRight')
    ];

    const eyes = document.querySelectorAll('.eye');

    document.addEventListener('mousemove', (event) => {
      eyes.forEach((eye, index) => {
        const rect = eye.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = event.clientX - cx;
        const dy = event.clientY - cy;
        const angle = Math.atan2(dy, dx);
        const radius = 26;

        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        pupils[index].style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
      });
    });

    // --- split heading into spans per character ---
    const title = document.getElementById('title');
    const text = title.textContent.trim();
    title.textContent = '';

    const chars = [];
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const span = document.createElement('span');
      span.className = 'char';
      span.textContent = ch === ' ' ? '\u00A0' : ch;
      title.appendChild(span);
      chars.push(span);
    }

    // helper to create fragments (particles)
    function createFragments(container, x, y, count = 18, size = 6) {
      for (let i = 0; i < count; i++) {
        const frag = document.createElement('div');
        frag.className = 'fragment';
        frag.style.width = size + 'px';
        frag.style.height = size + 'px';
        // starting position inside container
        frag.style.left = (x - size/2) + 'px';
        frag.style.top = (y - size/2) + 'px';
        // random flight vector
        const fx = 40 + Math.random() * 120;
        const fy = -60 + Math.random() * 80;
        const frot = (Math.random() * 360) + 'deg';
        frag.style.setProperty('--fx', fx + 'px');
        frag.style.setProperty('--fy', fy + 'px');
        frag.style.setProperty('--frot', frot);
        container.appendChild(frag);
        // remove after animation
        frag.addEventListener('animationend', () => frag.remove());
      }
    }

    // hovering on title triggers per-char deformation + fragments
    let titleTimeout = null;
    title.addEventListener('mouseenter', (e) => {
      // activate chars with stagger
      chars.forEach((span, i) => {
        const dir = (i % 2 === 0) ? 1 : -1;
        const tx = (8 + Math.random() * 28) * dir; // px
        const ty = -6 - Math.random() * 18; // px
        const rot = (-8 + Math.random() * 16) + 'deg';
        const op = 0.95 - Math.random() * 0.2;
        span.style.setProperty('--tx', tx + 'px');
        span.style.setProperty('--ty', ty + 'px');
        span.style.setProperty('--rot', rot);
        span.style.setProperty('--op', op);
        // small random delay when adding 'active' for nice cascade
        setTimeout(() => span.classList.add('active'), i * 18);
      });

      // create fragments from right edge of the title
      const rect = title.getBoundingClientRect();
      const container = document.body; // append to body so fragments fly freely
      const startX = rect.right - 24;
      const startY = rect.top + rect.height / 2;
      createFragments(container, startX, startY, 26, 7);

      // clear any pending timeout that would remove active state
      if (titleTimeout) { clearTimeout(titleTimeout); titleTimeout = null; }
    });

    title.addEventListener('mouseleave', () => {
      // remove active after short delay with reverse stagger
      for (let i = chars.length - 1; i >= 0; i--) {
        const span = chars[i];
        setTimeout(() => {
          // reset variables so CSS transition returns to normal
          span.style.setProperty('--tx', '0px');
          span.style.setProperty('--ty', '0px');
          span.style.setProperty('--rot', '0deg');
          span.style.setProperty('--op', '1');
          span.classList.remove('active');
        }, (chars.length - 1 - i) * 20);
      }
      // small fragments on leave as well
      const rect = title.getBoundingClientRect();
      createFragments(document.body, rect.right - 24, rect.top + rect.height / 2, 12, 6);
    });

    // fridge hover: deformation + fragments + subtle wave
    const fridge = document.getElementById('fridge');
    let fridgeHover = false;
    fridge.addEventListener('mouseenter', (e) => {
      fridgeHover = true;
      fridge.classList.add('deform');
      // create fragments along the right top edge
      const rect = fridge.getBoundingClientRect();
      const startX = rect.left + rect.width * 0.6;
      const startY = rect.top + rect.height * 0.36;
      createFragments(document.body, startX, startY, 28, 9);

      // small repeating micro-deforms while hovered
      let count = 0;
      function microPulse() {
        if (!fridgeHover) return;
        // tiny skew pulse
        fridge.style.transform = `perspective(800px) rotateY(${ -6 + Math.sin(count/3) * 1 }deg) skewX(${ -2 + Math.cos(count/2) * 0.6 }deg) scale(${1.01 + Math.sin(count/4)*0.005})`;
        count++;
        requestAnimationFrame(microPulse);
      }
      requestAnimationFrame(microPulse);
    });

    fridge.addEventListener('mouseleave', () => {
      fridgeHover = false;
      fridge.classList.remove('deform');
      fridge.style.transform = ''; // let CSS transition restore
      // some fragments on leave
      const rect = fridge.getBoundingClientRect();
      createFragments(document.body, rect.left + rect.width * 0.7, rect.top + rect.height * 0.4, 10, 8);
    });

    // accessibility: keyboard focus also triggers effects
    title.addEventListener('focus', () => title.dispatchEvent(new Event('mouseenter')));
    title.addEventListener('blur', () => title.dispatchEvent(new Event('mouseleave')));
    fridge.addEventListener('focus', () => fridge.dispatchEvent(new Event('mouseenter')));
    fridge.addEventListener('blur', () => fridge.dispatchEvent(new Event('mouseleave')));

    // allow fridge to be focusable for keyboard users
    fridge.tabIndex = 0;
    title.tabIndex = 0;
  </script>
</body>
</html>
